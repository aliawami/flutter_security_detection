name: Dart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Analyze and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Runs before codegen so a regenerated freezed file can't dirty the
      # git tree and trip the dry-run's clean-state validation.
      - name: Validate package for publishing
        run: flutter pub publish --dry-run

      - name: Generate Freezed files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: flutter test

      - name: Run example widget tests
        run: flutter test
        working-directory: example

  build-android:
    name: Build Android example
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      # Compiles the plugin's Kotlin sources, which flutter test never touches.
      - name: Build example APK
        run: flutter build apk --debug
        working-directory: example